networks:
  data-network:
    driver: bridge

volumes:
  postgres_data:
  airflow_db_data:

services:
  # --- Business Services ---
  db:
    image: postgres:15-alpine
    container_name: crypto_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data:z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-network
  
  # --- Message Broker (Confluent Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: pipeline_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: pipeline_kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-network

  # --- Caching Layer ---
  redis:
    image: redis:7-alpine
    container_name: pipeline_redis
    ports:
      - "6379:6379"
    networks:
      - data-network

  # --- MICROSERVICES WORKERS (UPDATED) ---
  
  # 1. API Server (Backend)
  backend:
    build: ./backend
    container_name: pipeline_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app:z
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - data-network

  # 2. Worker: Producer (Ingestion)
  producer:
    build: ./backend
    container_name: pipeline_producer
    command: python producer.py
    restart: always
    volumes:
      - ./backend:/app:z
    depends_on:
      - kafka
    networks:
      - data-network

  # 3. Worker: Consumer (Processing)
  consumer:
    build: ./backend
    container_name: pipeline_consumer
    env_file:
        - .env
    command: python consumer.py
    restart: always
    volumes:
      - ./backend:/app:z
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - data-network

  telegram_bot:
    build: ./backend
    container_name: pipeline_telegram_bot
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - data-network
    restart: always
    command: python telegram_bot.py
  # --- Frontend ---
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pipeline_frontend
    command: streamlit run frontend/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./frontend:/app/frontend:z
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - data-network

  # --- Airflow Services ---
  airflow-db:
    image: postgres:13
    container_name: airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data:z
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - data-network

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_webserver
    restart: always
    command: webserver 
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
      - ./backend:/opt/airflow/backend:z
      - ./etl:/opt/airflow/etl:z
      - ./ingestion:/opt/airflow/ingestion:z
      - ./.env:/opt/airflow/.env:z
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - data-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow_scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./dags:/opt/airflow/dags:z
      - ./logs:/opt/airflow/logs:z
      - ./plugins:/opt/airflow/plugins:z
      - ./backend:/opt/airflow/backend:z
      - ./etl:/opt/airflow/etl:z
      - ./ingestion:/opt/airflow/ingestion:z
      - ./.env:/opt/airflow/.env:z
    networks:
      - data-network