version: '3.8'

services:
  # Database 
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend 
  backend:
    build: .
    container_name: pipeline_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # Frontend 
  frontend:
    build: .
    container_name: pipeline_frontend
    command: streamlit run frontend/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env

volumes:
  postgres_data: